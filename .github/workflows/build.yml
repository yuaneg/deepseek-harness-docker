name: Build & Push

on:
  schedule:
    - cron: '0 0 * * *'   # 每天北京时间 8:00（UTC 0:00）
  workflow_dispatch:       # 手动触发
    inputs:
      dsh_tag:
        description: 'DSH 版本 tag（留空则自动检测最新）'
        required: false
        type: string

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 获取最新 DSH release tag
        id: latest
        run: |
          if [ -n "${{ inputs.dsh_tag }}" ]; then
            # 手动指定版本
            TAG="${{ inputs.dsh_tag }}"
          else
            # 自动获取最新 release tag
            TAG=$(curl -s https://api.github.com/repos/deepseek-ai/deepseek-harness/releases/latest | jq -r '.tag_name')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "DSH 版本: $TAG"

      - name: 检查是否已构建
        id: check
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          # 检查 GitHub Packages 是否已有该版本镜像
          EXISTS=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker:$TAG 2>/dev/null && echo "yes" || echo "no")
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT

          if [ "$EXISTS" = "yes" ] && [ -z "${{ inputs.dsh_tag }}" ]; then
            echo "版本 $TAG 已存在，跳过构建"
          else
            echo "版本 $TAG 需要构建"
          fi

      - name: 判断是否需要构建
        id: should_build
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "yes" ] && [ -z "${{ inputs.dsh_tag }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_build.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        if: steps.should_build.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: steps.should_build.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        if: steps.should_build.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            DSH_TAG=${{ steps.latest.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker:${{ steps.latest.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建完成
        if: steps.should_build.outputs.skip == 'false'
        run: |
          echo "✅ 构建完成: ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker:${{ steps.latest.outputs.tag }}"

      - name: 跳过构建
        if: steps.should_build.outputs.skip == 'true'
        run: echo "⏭️ 跳过构建，版本已存在"
